<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Classifier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Versteckt den hässlichen Standard-File-Input */
        input[type="file"] { display: none; }
        .custom-file-upload {
            display: inline-block;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .custom-file-upload:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center p-6">

    <div class="bg-white/95 backdrop-blur-sm shadow-2xl rounded-3xl p-8 max-w-2xl w-full border border-white/20">
        
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600 mb-2">
                Vision AI
            </h1>
            <p class="text-gray-500 font-medium">DeepJavaLibrary • ResNet-18 Image Classification</p>
        </div>

        <div class="text-center mb-8">
            <label class="custom-file-upload group w-full">
                <div class="border-2 border-dashed border-indigo-300 rounded-2xl p-10 bg-indigo-50 group-hover:bg-indigo-100 transition duration-300">
                    <svg class="w-12 h-12 text-indigo-500 mx-auto mb-4 group-hover:scale-110 transition duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                    </svg>
                    <span class="text-indigo-600 font-semibold text-lg">Klick hier, um ein Bild hochzuladen</span>
                    <p class="text-gray-400 text-sm mt-2">Unterstützt JPG, PNG</p>
                </div>
                <input type="file" accept="image/jpeg, image/png" name="image" onchange="checkFiles(this.files);">
            </label>
        </div>

        <div id="answerPart" class="hidden opacity-0 transition-opacity duration-500">
            <hr class="border-gray-200 mb-8">
            <div class="flex flex-col md:flex-row gap-8">
                
                <div class="w-full md:w-1/2">
                    <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">Dein Bild</h3>
                    <div class="rounded-2xl overflow-hidden shadow-md border border-gray-100">
                        <img id="preview" src="#" alt="preview" class="w-full h-auto object-cover" />
                    </div>
                </div>
                
                <div class="w-full md:w-1/2 flex flex-col">
                    <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">KI Analyse</h3>
                    <div id="answer" class="space-y-4">
                        <div class="animate-pulse flex space-x-4">
                            <div class="flex-1 space-y-4 py-1">
                                <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                                <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
